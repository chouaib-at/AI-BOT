<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Crypto Trading Analysis Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; padding: 24px; background: #0b0e14; color: #e6e6e6; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8a8f98; margin-bottom: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .card { background: #131722; border: 1px solid #232838; border-radius: 10px; padding: 16px; flex: 1; min-width: 220px; }
  .card h2 { font-size: 13px; text-transform: uppercase; color: #8a8f98; margin: 0 0 8px; }
  .signal { border-left: 4px solid #2ecc71; margin-bottom: 12px; padding: 12px; background: #131722; border-radius: 8px; }
  .signal.watchlist { border-left-color: #f5b942; }
  .signal.notrade { border-left-color: #4a4f5c; opacity: .7; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.buy { background: #16351f; color: #2ecc71; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; font-size: 13px; }
  .grid2 div span { color: #8a8f98; display: block; font-size: 11px; }
  button { background: #2ecc71; border: none; color: #05130a; font-weight: 700; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #err { color: #ff6b6b; margin-top: 8px; }
  .pill { background: #232838; padding: 3px 8px; border-radius: 6px; margin-right: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Crypto Trading Analysis Bot</h1>
  <div class="sub">Analysis &amp; signal generation only — no trades are ever executed automatically.</div>

  <button id="scanBtn">Run Scan Now</button>
  <span id="err"></span>

  <div class="row" style="margin-top:20px">
    <div class="card"><h2>Market Condition</h2><div id="market">—</div></div>
    <div class="card"><h2>Top Coins</h2><div id="topCoins">—</div></div>
  </div>

  <div class="card" style="margin-bottom:24px">
    <h2>Best Opportunities</h2>
    <div id="opportunities">No scan run yet.</div>
  </div>

  <div class="card" style="margin-bottom:24px">
    <h2>Watchlist</h2>
    <div id="watchlist">—</div>
  </div>

  <div class="card">
    <h2>No Trade</h2>
    <div id="noTrade">—</div>
  </div>

<script>
const API_BASE = window.API_BASE || 'http://localhost:8000';

async function runScan() {
  const btn = document.getElementById('scanBtn');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Scanning...'; err.textContent = '';
  try {
    const res = await fetch(`${API_BASE}/api/scan`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    render(await res.json());
  } catch (e) {
    err.textContent = 'Scan failed: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Run Scan Now';
  }
}

function render(scan) {
  document.getElementById('market').innerHTML =
    `<span class="pill">${(scan.market_regime.btc_trend || 'unknown').toUpperCase()}</span>` +
    `<span class="pill">${scan.market_regime.risk_mode || 'unknown'}</span>`;
  document.getElementById('topCoins').innerHTML = scan.top_coins.map(c => `<span class="pill">${c}</span>`).join('') || '(none)';

  const opDiv = document.getElementById('opportunities');
  opDiv.innerHTML = scan.opportunities.length ? scan.opportunities.map(op => `
    <div class="signal">
      <b>${op.symbol}/USDT</b> <span class="badge buy">${op.signal}</span> — ${op.setup}
      <div class="grid2">
        <div><span>Entry</span>${op.entry}</div>
        <div><span>Stop Loss</span>${op.stop_loss}</div>
        <div><span>TP1</span>${op.take_profit_1}</div>
        <div><span>TP2</span>${op.take_profit_2}</div>
        <div><span>Risk/Reward</span>${op.risk_reward}:1</div>
        <div><span>Confidence</span>${op.confidence_score}/100</div>
      </div>
      <div style="margin-top:8px;color:#8a8f98;font-size:13px">${op.explanation}</div>
    </div>`).join('') : '(none met the confidence threshold today)';

  document.getElementById('watchlist').innerHTML = scan.watchlist.length
    ? scan.watchlist.map(w => `<div class="signal watchlist">${w.symbol}/USDT — score ${w.confidence_score}/100</div>`).join('')
    : '(none)';

  document.getElementById('noTrade').innerHTML = scan.no_trade.length
    ? scan.no_trade.map(n => `<div class="signal notrade">${n.symbol}/USDT — ${n.reason}</div>`).join('')
    : '(none)';
}

document.getElementById('scanBtn').addEventListener('click', runScan);

// Load the latest scan on page open, if one exists.
fetch(`${API_BASE}/api/scan/latest`).then(r => r.json()).then(d => { if (d.opportunities) render(d); });
</script>
</body>
</html>
